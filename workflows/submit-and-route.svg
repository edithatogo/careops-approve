<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
  <title id="title">CareOps submit and route approval process</title>
  <desc id="desc">A request is validated, routed to an assigned approver, escalated to EDMS after fourteen days, and finalized with restricted visibility and no email.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
  <rect width="1500" height="620" fill="#f8fafc"/>
  <text x="45" y="45" font-family="Segoe UI,Arial" font-size="26" font-weight="700" fill="#0f172a">CareOps submit and route</text>
  <text x="45" y="72" font-family="Segoe UI,Arial" font-size="14" fill="#475569">BPMN 2.0 companion visual · tenant-neutral · email disabled</text>
  <g font-family="Segoe UI,Arial" font-size="15" text-anchor="middle">
    <ellipse cx="90" cy="170" rx="42" ry="28" fill="#dcfce7" stroke="#166534" stroke-width="2"/><text x="90" y="175" fill="#14532d">Submit</text>
    <rect x="160" y="135" width="150" height="70" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="235" y="165" fill="#1e3a8a">Validate</text><text x="235" y="186" fill="#1e3a8a">request</text>
    <polygon points="370,170 410,130 450,170 410,210" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="410" y="175" fill="#713f12">Valid?</text>
    <rect x="500" y="135" width="160" height="70" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="580" y="165" fill="#1e3a8a">Resolve</text><text x="580" y="186" fill="#1e3a8a">approver</text>
    <rect x="710" y="135" width="170" height="70" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="795" y="165" fill="#1e3a8a">Persist</text><text x="795" y="186" fill="#1e3a8a">submission</text>
    <rect x="930" y="135" width="190" height="70" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="1025" y="165" fill="#4c1d95">Teams approval</text><text x="1025" y="186" fill="#4c1d95">no email</text>
    <rect x="1170" y="135" width="180" height="70" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="1260" y="165" fill="#4c1d95">Decision /</text><text x="1260" y="186" fill="#4c1d95">cancellation</text>
    <ellipse cx="1420" cy="170" rx="48" ry="28" fill="#dcfce7" stroke="#166534" stroke-width="2"/><text x="1420" y="175" fill="#14532d">Final</text>
    <rect x="1110" y="350" width="210" height="70" rx="12" fill="#fce7f3" stroke="#be185d" stroke-width="2"/><text x="1215" y="380" fill="#831843">14-day timeout</text><text x="1215" y="401" fill="#831843">EDMS escalation</text>
    <rect x="710" y="350" width="220" height="70" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="820" y="380" fill="#1e293b">Restricted visibility</text><text x="820" y="401" fill="#1e293b">owner/requester/approver</text>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M132 170 H160"/><path d="M310 170 H370"/><path d="M450 170 H500"/><path d="M660 170 H710"/><path d="M880 170 H930"/><path d="M1120 170 H1170"/><path d="M1350 170 H1370"/><path d="M1260 205 V350"/><path d="M1170 385 H930 V205"/><path d="M1025 205 V350 H930"/><path d="M710 385 H600 V240"/></g>
  <g font-family="Segoe UI,Arial" font-size="13" fill="#475569"><text x="462" y="155">yes</text><text x="400" y="245">no → preserve and alert owner</text><text x="1268" y="285">timeout</text></g>
</svg>
