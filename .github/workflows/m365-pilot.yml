name: Native M365 pilot source safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: m365-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    name: M365 pilot (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.15.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        id: python_runtime
        with:
          python-version: ${{ matrix.python }}
      - name: Create and verify the repository-local Python environment
        shell: pwsh
        env:
          SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          EXPECTED_PYTHON: ${{ matrix.python }}
        run: |
          $environment = Join-Path $env:GITHUB_WORKSPACE '.local/approve-ci'
          try { $existing = Get-Item -LiteralPath $environment -Force -ErrorAction Stop }
          catch [System.Management.Automation.ItemNotFoundException] { $existing = $null }
          if ($null -ne $existing) { throw 'Refusing a pre-existing helper environment.' }
          & $env:SELECTED_PYTHON -I -m venv $environment
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the isolated helper environment.' }
          $executable = Join-Path $environment $(if ($IsWindows) { 'Scripts/python.exe' } else { 'bin/python' })
          @'
          import os, pathlib, platform, sys, sysconfig
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.local/approve-ci'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected repository-local Python 3.15 interpreter.')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write(sysconfig.get_path('scripts') + '\n')
          print('Verified repository-local Python', platform.python_version())
          '@ | & $executable -I -
          if ($LASTEXITCODE -ne 0) { throw 'Isolated helper runtime verification failed.' }
      - name: Install pinned test-only tools
        run: |
          python .github/scripts/test-ci-lock.py
          python .github/scripts/check-ci-lock.py
          python -m pip install --require-hashes -r requirements-ci.lock
      - name: Strict static checks
        run: |
          python -m ruff check --config tests/m365_pilot/pyproject.toml scripts/build_m365_pilot.py tests/m365_pilot
          python -m mypy --config-file tests/m365_pilot/pyproject.toml scripts/build_m365_pilot.py tests/m365_pilot
      - name: Behaviour and committed-source parity
        run: |
          python -m coverage run --branch --source=scripts.build_m365_pilot -m unittest discover -s tests/m365_pilot -v
          python -m coverage report --show-missing --fail-under=100
          python scripts/build_m365_pilot.py
      - name: Preserve pilot SOURCE assets, not a flow import package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: m365-synthetic-pilot-source-${{ matrix.python }}
          path: pilot/m365/
          if-no-files-found: error
          retention-days: 14
