name: Native M365 pilot source safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: m365-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    name: M365 pilot (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned test-only tools
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Strict static checks
        run: |
          python -m ruff check --config tests/m365_pilot/pyproject.toml scripts/build_m365_pilot.py tests/m365_pilot
          python -m mypy --config-file tests/m365_pilot/pyproject.toml scripts/build_m365_pilot.py tests/m365_pilot
      - name: Behaviour and committed-source parity
        run: |
          python -m coverage run --branch --source=scripts.build_m365_pilot -m unittest discover -s tests/m365_pilot -v
          python -m coverage report --show-missing --fail-under=100
          python scripts/build_m365_pilot.py
      - name: Preserve pilot SOURCE assets, not a flow import package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: m365-synthetic-pilot-source-${{ matrix.python }}
          path: pilot/m365/
          if-no-files-found: error
          retention-days: 14
