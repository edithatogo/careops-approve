name: Credentialing intake contracts

on:
  pull_request:
    paths:
      - 'contracts/credentialing-*.json'
      - 'contracts/existing-system-source-record.schema.json'
      - 'contracts/fixtures/credentialing-*.json'
      - 'flows/credentialing-intake-and-handoff.contract.json'
      - 'flows/imported-source-record-review.contract.json'
      - 'scripts/Test-CredentialingContracts.ps1'
      - '.github/workflows/credentialing-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/credentialing-*.json'
      - 'contracts/existing-system-source-record.schema.json'
      - 'contracts/fixtures/credentialing-*.json'
      - 'flows/credentialing-intake-and-handoff.contract.json'
      - 'flows/imported-source-record-review.contract.json'
      - 'scripts/Test-CredentialingContracts.ps1'
      - '.github/workflows/credentialing-contracts.yml'

permissions:
  contents: read

concurrency:
  group: credentialing-intake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Synthetic intake, handoff and human-review checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out without persistent credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Validate credentialing intake contracts
        shell: pwsh
        run: ./scripts/Test-CredentialingContracts.ps1
