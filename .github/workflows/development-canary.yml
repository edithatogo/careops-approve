name: Development qualification
on:
  schedule:
    - cron: '23 18 * * 2'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/development-canary.yml'
      - '.github/scripts/**'
      - 'requirements-ci.*'
permissions:
  contents: read
concurrency:
  group: development-canary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tools:
    name: Preview tool qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Read immutable CareOps CI helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: edithatogo/careops
          ref: 30df4953ea87c8915b4a525fc671a4c9857c3f7f
          path: .local/ci-policy
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python_runtime
        with:
          python-version: '3.15.1'
      - name: Create and verify the canary helper environment
        id: helper
        shell: pwsh
        env:
          SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          EXPECTED_PYTHON: '3.15.1'
        run: |
          $environment = Join-Path $env:GITHUB_WORKSPACE '.local/approve-canary-helper'
          try { $existing = Get-Item -LiteralPath $environment -Force -ErrorAction Stop }
          catch [System.Management.Automation.ItemNotFoundException] { $existing = $null }
          if ($null -ne $existing) { throw 'Refusing a pre-existing helper environment.' }
          & $env:SELECTED_PYTHON -I -m venv $environment
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the isolated helper environment.' }
          $executable = Join-Path $environment $(if ($IsWindows) { 'Scripts/python.exe' } else { 'bin/python' })
          @'
          import os, pathlib, platform, sys, sysconfig
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.local/approve-canary-helper'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected repository-local Python 3.15 interpreter.')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write(sysconfig.get_path('scripts') + '\n')
          print('Verified repository-local Python', platform.python_version())
          '@ | & $executable -I -
          if ($LASTEXITCODE -ne 0) { throw 'Isolated helper runtime verification failed.' }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Resolve exact preview candidates without changing the working lock
        run: python .local/ci-policy/portfolio-scripts/ci_delivery.py lock --preview --output .local/canary/requirements.lock --receipt .local/canary/candidate.json
      - name: Install only the resolved hash-locked candidate
        run: |
          candidate="$GITHUB_WORKSPACE/.local/approve-tool-candidate"
          if [ -e "$candidate" ] || [ -L "$candidate" ]; then
            echo 'Refusing an existing candidate environment.' >&2
            exit 1
          fi
          python -I -m venv "$candidate"
          "$candidate/bin/python" -I - "$candidate" <<'PYCODE'
          import pathlib, platform, sys
          if platform.python_version() != '3.15.1' or pathlib.Path(sys.prefix).resolve() != pathlib.Path(sys.argv[1]).resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected local tool-candidate interpreter.')
          PYCODE
          "$candidate/bin/python" -m pip install --require-hashes -r .local/canary/requirements.lock
      - name: Qualify affected tools and source behaviour
        run: |
          "$GITHUB_WORKSPACE/.local/approve-tool-candidate/bin/python" .github/scripts/qualify-python.py
          "$GITHUB_WORKSPACE/.local/approve-tool-candidate/bin/pip-audit" --disable-pip --no-deps -r .local/canary/requirements.lock
          "$GITHUB_WORKSPACE/.local/approve-tool-candidate/bin/zizmor" --offline --persona pedantic --format plain .github/workflows
      - name: Keep exact candidate evidence even after a qualification failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-candidate
          path: .local/canary/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  runtime:
    name: Runtime preview discovery and compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Read immutable CareOps CI helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: edithatogo/careops
          ref: 30df4953ea87c8915b4a525fc671a4c9857c3f7f
          path: .local/ci-policy
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python_runtime
        with:
          python-version: '3.15.1'
      - name: Create and verify the canary helper environment
        id: helper
        shell: pwsh
        env:
          SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          EXPECTED_PYTHON: '3.15.1'
        run: |
          $environment = Join-Path $env:GITHUB_WORKSPACE '.local/approve-canary-helper'
          try { $existing = Get-Item -LiteralPath $environment -Force -ErrorAction Stop }
          catch [System.Management.Automation.ItemNotFoundException] { $existing = $null }
          if ($null -ne $existing) { throw 'Refusing a pre-existing helper environment.' }
          & $env:SELECTED_PYTHON -I -m venv $environment
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the isolated helper environment.' }
          $executable = Join-Path $environment $(if ($IsWindows) { 'Scripts/python.exe' } else { 'bin/python' })
          @'
          import os, pathlib, platform, sys, sysconfig
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.local/approve-canary-helper'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected repository-local Python 3.15 interpreter.')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write(sysconfig.get_path('scripts') + '\n')
          print('Verified repository-local Python', platform.python_version())
          '@ | & $executable -I -
          if ($LASTEXITCODE -ne 0) { throw 'Isolated helper runtime verification failed.' }
      - name: Verify failed discovery retains a terminal receipt
        run: |
          probe_receipt=".local/runtime-contract-probe/discovery.json"
          python .local/ci-policy/portfolio-scripts/ci_delivery.py runtime-finalize --receipt "$probe_receipt" --discovery-outcome failure --outcome skipped
          python - "$probe_receipt" <<'PYTHON'
          import json
          import sys
          from pathlib import Path
          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt['state'] == 'discovery-failed'
          assert receipt['discoveryOutcome'] == 'failure'
          assert receipt['runtimeTestOutcome'] == 'skipped'
          assert receipt['runtimeTestsExecuted'] is False
          assert receipt['promoted'] is False
          PYTHON
      - name: Discover a runnable preview newer than the qualified baseline
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .local/runtime-canary
          runtime_manifest_revision="$(gh api repos/actions/python-versions/commits/main --jq .sha)"
          [[ "$runtime_manifest_revision" =~ ^[a-f0-9]{40}$ ]]
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/actions/python-versions/$runtime_manifest_revision/versions-manifest.json" -o .local/runtime-canary/manifest.json
          runtime_platform="$(python -c 'import platform; print(platform.freedesktop_os_release()["VERSION_ID"])')"
          python .local/ci-policy/portfolio-scripts/ci_delivery.py runtime --platform-version "$runtime_platform" --manifest .local/runtime-canary/manifest.json --manifest-revision "$runtime_manifest_revision" --output .local/runtime-canary/discovery.json --github-output "$GITHUB_OUTPUT"
      - name: Set up the exact available preview only
        id: preview
        if: steps.discover.outputs.available == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.discover.outputs.version }}
          allow-prereleases: true
      - name: Record the resolved runtime and install current qualified tools
        if: steps.discover.outputs.available == 'true'
        env:
          SELECTED_PREVIEW: ${{ steps.preview.outputs.python-path }}
          EXPECTED_PREVIEW: ${{ steps.discover.outputs.version }}
        run: |
          preview="$GITHUB_WORKSPACE/.local/approve-preview"
          if [ -e "$preview" ] || [ -L "$preview" ]; then
            echo 'Refusing an existing preview environment.' >&2
            exit 1
          fi
          "$SELECTED_PREVIEW" -I -m venv "$preview"
          "$preview/bin/python" -I - <<'PYCODE'
          import os, pathlib, platform, sys
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.local/approve-preview'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PREVIEW'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected local preview interpreter.')
          PYCODE
          mkdir -p .local/runtime-canary
          "$preview/bin/python" -VV > .local/runtime-canary/python-version.txt
          "$preview/bin/python" -m pip install --require-hashes -r requirements-ci.lock
      - name: Test current source against development CPython
        id: runtime_tests
        if: steps.discover.outputs.available == 'true'
        run: |
          "$GITHUB_WORKSPACE/.local/approve-preview/bin/python" .github/scripts/qualify-python.py
      - name: Record the actual runtime qualification outcome
        if: always()
        env:
          HELPER_OUTCOME: ${{ steps.helper.outcome }}
          DISCOVERY_OUTCOME: ${{ steps.discover.outcome }}
          RUNTIME_TEST_OUTCOME: ${{ steps.runtime_tests.outcome }}
        run: |
          if [ "$HELPER_OUTCOME" != success ] || [ ! -x "$GITHUB_WORKSPACE/.local/approve-canary-helper/bin/python" ]; then
            mkdir -p .local/runtime-canary
            printf '%s\n' '{"state":"setup-blocked","promoted":false,"runtimeTestsExecuted":false,"reason":"verified-helper-unavailable"}' > .local/runtime-canary/helper-failure.json
            exit 1
          fi
          "$GITHUB_WORKSPACE/.local/approve-canary-helper/bin/python" -I .local/ci-policy/portfolio-scripts/ci_delivery.py runtime-finalize --receipt .local/runtime-canary/discovery.json --outcome "$RUNTIME_TEST_OUTCOME" --discovery-outcome "$DISCOVERY_OUTCOME"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-candidate
          path: .local/runtime-canary/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  sdk-discovery:
    name: Published .NET preview discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      available: ${{ steps.discover.outputs.available }}
      version: ${{ steps.discover.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        id: python_runtime
        with:
          python-version: '3.15.1'
      - name: Create and verify the canary helper environment
        id: helper
        shell: pwsh
        env:
          SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          EXPECTED_PYTHON: '3.15.1'
        run: |
          $environment = Join-Path $env:GITHUB_WORKSPACE '.local/approve-canary-helper'
          try { $existing = Get-Item -LiteralPath $environment -Force -ErrorAction Stop }
          catch [System.Management.Automation.ItemNotFoundException] { $existing = $null }
          if ($null -ne $existing) { throw 'Refusing a pre-existing helper environment.' }
          & $env:SELECTED_PYTHON -I -m venv $environment
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the isolated helper environment.' }
          $executable = Join-Path $environment $(if ($IsWindows) { 'Scripts/python.exe' } else { 'bin/python' })
          @'
          import os, pathlib, platform, sys, sysconfig
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.local/approve-canary-helper'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected repository-local Python 3.15 interpreter.')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write(sysconfig.get_path('scripts') + '\n')
          print('Verified repository-local Python', platform.python_version())
          '@ | & $executable -I -
          if ($LASTEXITCODE -ne 0) { throw 'Isolated helper runtime verification failed.' }
      - name: Read published SDK metadata and test fail-closed selection
        id: discover
        run: |
          mkdir -p .local/sdk-canary
          python .github/scripts/test-dotnet-preview.py
          curl --fail --silent --show-error --location https://builds.dotnet.microsoft.com/dotnet/release-metadata/11.0/releases.json -o .local/sdk-canary/releases.json
          python .github/scripts/select-dotnet-preview.py .local/sdk-canary/releases.json .local/sdk-canary/discovery.json "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sdk-discovery
          path: .local/sdk-canary/
          include-hidden-files: true
          if-no-files-found: warn
  sdk:
    name: Offline PAC packaging on development SDK
    needs: sdk-discovery
    if: needs.sdk-discovery.outputs.available == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PREVIEW_SDK: ${{ needs.sdk-discovery.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: |
            10.0.402
            ${{ needs.sdk-discovery.outputs.version }}
      - name: Install exact PAC without login and pack existing source
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out/sdk-canary | Out-Null
          @{ sdk = @{ version = $env:PREVIEW_SDK; rollForward = 'disable'; allowPrerelease = $true } } | ConvertTo-Json | Set-Content global.json
          $actual = (& dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:PREVIEW_SDK) { throw 'Exact preview SDK was not selected.' }
          dotnet tool install Microsoft.PowerApps.CLI.Tool --version 2.13.1 --tool-path out/pac-canary
          if ($LASTEXITCODE -ne 0) { throw 'PAC installation failed.' }
          $pacHelp = & ./out/pac-canary/pac.exe help
          $pacExit = $LASTEXITCODE
          $pacHelp | Set-Content out/sdk-canary/pac-version.txt
          if ($pacExit -ne 0 -or ($pacHelp -join "`n") -notmatch '(?m)^Version: 2\.13\.1(?:\+|\s)') { throw 'Expected PAC executable version was not verified.' }
          & ./out/pac-canary/pac.exe solution pack --folder src/solutions/CareOpsApprove --zipfile out/sdk-canary/CareOpsApprove_unmanaged.zip --packagetype Unmanaged
          if ($LASTEXITCODE -ne 0) { throw 'Offline solution packaging failed.' }
          @{ sdk = $actual; pac = '2.13.1'; packageSha256 = (Get-FileHash out/sdk-canary/CareOpsApprove_unmanaged.zip -Algorithm SHA256).Hash.ToLower(); promoted = $false; nativeWrites = $false } | ConvertTo-Json | Set-Content out/sdk-canary/receipt.json
      - name: Keep SDK packaging evidence after success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: development-sdk-package
          path: out/sdk-canary/
          if-no-files-found: warn
          retention-days: 14
