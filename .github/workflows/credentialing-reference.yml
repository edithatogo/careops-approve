name: Credentialing reference safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: credentialing-reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  safety:
    name: Reference safety (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.15.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned test-only tools
        run: |
          python .github/scripts/test-ci-lock.py
          python .github/scripts/check-ci-lock.py
          python -m pip install --require-hashes -r requirements-ci.lock
      - name: Static quality
        run: |
          python -m ruff check --config reference/pyproject.toml reference tests/reference
          python -m mypy --config-file reference/pyproject.toml reference tests/reference
      - name: Behavioural safety and full branch coverage
        run: |
          python -m coverage run --branch --source=reference -m unittest discover -s tests/reference -v
          python -m coverage report --show-missing --fail-under=100
