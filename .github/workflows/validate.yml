name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: repository
    timeout-minutes: 20
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate repository contracts
        shell: pwsh
        run: ./scripts/Test-Repository.ps1 -SkipRemoteTopology

  power-platform-package:
    name: power-platform-package
    timeout-minutes: 20
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select the qualified .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      - name: Install Microsoft Power Platform tools
        if: ${{ hashFiles('src/solutions/CareOpsApprove/Other/Solution.xml') != '' }}
        uses: microsoft/powerplatform-actions/actions-install@6e91314a9c6e694ea5c894fe8c40e09d73aa892b
        with:
          pac-version-override: '2.13.1'
          add-tools-to-path: true

      - name: Pack unmanaged solution
        if: ${{ hashFiles('src/solutions/CareOpsApprove/Other/Solution.xml') != '' }}
        uses: microsoft/powerplatform-actions/pack-solution@6e91314a9c6e694ea5c894fe8c40e09d73aa892b
        with:
          solution-folder: src/solutions/CareOpsApprove
          solution-file: out/CareOpsApprove_unmanaged.zip
          solution-type: Unmanaged

      - name: Select the qualified inventory runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.0'
      - name: Read immutable qualified artifact tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: edithatogo/careops
          ref: f0e8db252b181955d31185f1ccdd1e77dee1f5f9
          path: .careops-ci-tools
          persist-credentials: false
          submodules: false
      - name: Inventory the actual solution archive
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $epoch = git show -s --format=%ct $env:SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Source timestamp unavailable.' }
          python .careops-ci-tools/portfolio-scripts/artifact_sbom.py --artifact out/CareOpsApprove_unmanaged.zip --name CareOpsApprove-unmanaged --source-commit $env:SOURCE_COMMIT --created-epoch $epoch --output out/CareOpsApprove.spdx.json
          if ($LASTEXITCODE -ne 0) { throw 'Actual package inventory failed.' }

      - name: Upload solution artifact
        if: ${{ hashFiles('src/solutions/CareOpsApprove/Other/Solution.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: CareOpsApprove-unmanaged
          path: |
            out/CareOpsApprove_unmanaged.zip
            out/CareOpsApprove.spdx.json
          if-no-files-found: error

  attest-package:
    name: Attest main source package
    needs: [repository, power-platform-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Federated signing for the exact previously built package.
      attestations: write # Store package provenance and SPDX signatures only.
    steps:
      - name: Download the package built once by this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: CareOpsApprove-unmanaged
          path: candidate
      - name: Select the qualified verification runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.0'
      - name: Independently compare downloaded package with its inventory
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, zipfile
          from pathlib import Path
          package = Path('candidate/CareOpsApprove_unmanaged.zip')
          document = json.loads(Path('candidate/CareOpsApprove.spdx.json').read_text())
          assert document['packages'][0]['sourceInfo'] == 'Source commit: ' + os.environ['SOURCE_COMMIT']
          assert document['packages'][0]['checksums'][0]['checksumValue'] == hashlib.sha256(package.read_bytes()).hexdigest()
          with zipfile.ZipFile(package) as archive:
              entries = [entry for entry in archive.infolist() if not entry.is_dir()]
              assert len({entry.filename for entry in entries}) == len(entries)
              actual = {entry.filename: hashlib.sha256(archive.read(entry)).hexdigest() for entry in entries}
          declared = {entry['fileName'].removeprefix('./'): next(c['checksumValue'] for c in entry['checksums'] if c['algorithm'] == 'SHA256') for entry in document['files']}
          assert actual and len(declared) == len(document['files']) and actual == declared
          print('Exact downloaded archive and all file digests match the inventory.')
          PYCODE
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: candidate/CareOpsApprove_unmanaged.zip
          create-storage-record: false
      - name: Attest exact artifact inventory
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: candidate/CareOpsApprove_unmanaged.zip
          sbom-path: candidate/CareOpsApprove.spdx.json
          create-storage-record: false
      - name: Verify exact source and workflow signatures
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" candidate/build-attestation.jsonl
          cp "$SBOM_BUNDLE" candidate/sbom-attestation.jsonl
          gh attestation verify candidate/CareOpsApprove_unmanaged.zip --bundle "$PROVENANCE_BUNDLE" --repo edithatogo/careops-approve --signer-workflow edithatogo/careops-approve/.github/workflows/validate.yml --source-ref refs/heads/main --source-digest "$SOURCE_COMMIT" --signer-digest "$SOURCE_COMMIT" --deny-self-hosted-runners --format json > candidate/provenance-verification.json
          gh attestation verify candidate/CareOpsApprove_unmanaged.zip --bundle "$SBOM_BUNDLE" --repo edithatogo/careops-approve --signer-workflow edithatogo/careops-approve/.github/workflows/validate.yml --source-ref refs/heads/main --source-digest "$SOURCE_COMMIT" --signer-digest "$SOURCE_COMMIT" --deny-self-hosted-runners --predicate-type https://spdx.dev/Document/v2.3 --format json > candidate/sbom-verification.json
      - name: Preserve exact package and signature evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: CareOpsApprove-attested-source-candidate-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 30
