name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository contracts
        shell: pwsh
        run: ./scripts/Test-Repository.ps1

  power-platform-package:
    if: ${{ hashFiles('src/solutions/CareOpsApprove/Other/Solution.xml') != '' }}
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Microsoft Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Pack unmanaged solution
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: src/solutions/CareOpsApprove
          solution-file: out/CareOpsApprove_unmanaged.zip
          solution-type: Unmanaged

      - name: Upload solution artifact
        uses: actions/upload-artifact@v4
        with:
          name: CareOpsApprove-unmanaged
          path: out/CareOpsApprove_unmanaged.zip
          if-no-files-found: error
