name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository contracts
        shell: pwsh
        run: ./scripts/Test-Repository.ps1 -SkipRemoteTopology

  power-platform-package:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Microsoft Power Platform tools
        if: ${{ hashFiles('src/solutions/CareOpsApprove/Other/Solution.xml') != '' }}
        uses: microsoft/powerplatform-actions/actions-install@59c0b2abadc26618ca914c689ab9dc399da4d6bb # v1.9.2

      - name: Pack unmanaged solution
        if: ${{ hashFiles('src/solutions/CareOpsApprove/Other/Solution.xml') != '' }}
        uses: microsoft/powerplatform-actions/pack-solution@59c0b2abadc26618ca914c689ab9dc399da4d6bb # v1.9.2
        with:
          solution-folder: src/solutions/CareOpsApprove
          solution-file: out/CareOpsApprove_unmanaged.zip
          solution-type: Unmanaged

      - name: Upload solution artifact
        if: ${{ hashFiles('src/solutions/CareOpsApprove/Other/Solution.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CareOpsApprove-unmanaged
          path: out/CareOpsApprove_unmanaged.zip
          if-no-files-found: error
