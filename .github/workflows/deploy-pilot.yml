name: Deploy pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careops-approve-pilot
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-latest
    environment: pilot
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require solution source
        shell: pwsh
        run: |
          if (-not (Test-Path 'src/solutions/CareOpsApprove/Other/Solution.xml')) {
            throw 'CareOpsApprove solution source has not been harvested yet.'
          }

      - name: Validate repository contracts
        shell: pwsh
        run: ./scripts/Test-Repository.ps1 -SkipRemoteTopology

      - name: Install Microsoft Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@59c0b2abadc26618ca914c689ab9dc399da4d6bb # v1.9.2

      - name: Pack pilot solution
        uses: microsoft/powerplatform-actions/pack-solution@59c0b2abadc26618ca914c689ab9dc399da4d6bb # v1.9.2
        with:
          solution-folder: src/solutions/CareOpsApprove
          solution-file: out/CareOpsApprove_unmanaged.zip
          solution-type: Unmanaged

      - name: Run Power Apps solution checker
        uses: microsoft/powerplatform-actions/check-solution@59c0b2abadc26618ca914c689ab9dc399da4d6bb # v1.9.2
        with:
          environment-url: ${{ secrets.POWERPLATFORM_URL }}
          app-id: ${{ secrets.POWERPLATFORM_APP_ID }}
          client-secret: ${{ secrets.POWERPLATFORM_CLIENT_SECRET }}
          tenant-id: ${{ secrets.POWERPLATFORM_TENANT_ID }}
          path: out/CareOpsApprove_unmanaged.zip
          fail-on-analysis-error: true

      - name: Import into pilot
        uses: microsoft/powerplatform-actions/import-solution@59c0b2abadc26618ca914c689ab9dc399da4d6bb # v1.9.2
        with:
          environment-url: ${{ secrets.POWERPLATFORM_URL }}
          app-id: ${{ secrets.POWERPLATFORM_APP_ID }}
          client-secret: ${{ secrets.POWERPLATFORM_CLIENT_SECRET }}
          tenant-id: ${{ secrets.POWERPLATFORM_TENANT_ID }}
          solution-file: out/CareOpsApprove_unmanaged.zip
          publish-changes: true
          use-deployment-settings-file: true
          deployment-settings-file: config/pilot.deploymentSettings.example.json

      - name: Retain deployed package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CareOpsApprove-pilot-${{ github.run_number }}
          path: out/CareOpsApprove_unmanaged.zip
          if-no-files-found: error
