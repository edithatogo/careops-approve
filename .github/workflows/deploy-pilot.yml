name: Deploy pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careops-approve-pilot
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    timeout-minutes: 20
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-latest
    environment: pilot
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Require solution source
        shell: pwsh
        run: |
          ./scripts/Test-SolutionSource.ps1 -RequireRuntimeComponents

      - name: Validate repository contracts
        shell: pwsh
        run: ./scripts/Test-Repository.ps1 -SkipRemoteTopology

      - name: Select the qualified .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      - name: Install Microsoft Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@6e91314a9c6e694ea5c894fe8c40e09d73aa892b
        with:
          pac-version-override: '2.13.1'
          add-tools-to-path: true

      - name: Pack pilot solution
        uses: microsoft/powerplatform-actions/pack-solution@6e91314a9c6e694ea5c894fe8c40e09d73aa892b
        with:
          solution-folder: src/solutions/CareOpsApprove
          solution-file: out/CareOpsApprove_unmanaged.zip
          solution-type: Unmanaged

      - name: Run Power Apps solution checker
        uses: microsoft/powerplatform-actions/check-solution@6e91314a9c6e694ea5c894fe8c40e09d73aa892b
        with:
          environment-url: ${{ secrets.POWERPLATFORM_URL }}
          app-id: ${{ secrets.POWERPLATFORM_APP_ID }}
          client-secret: ${{ secrets.POWERPLATFORM_CLIENT_SECRET }}
          tenant-id: ${{ secrets.POWERPLATFORM_TENANT_ID }}
          path: out/CareOpsApprove_unmanaged.zip
          fail-on-analysis-error: true

      - name: Import into pilot
        uses: microsoft/powerplatform-actions/import-solution@6e91314a9c6e694ea5c894fe8c40e09d73aa892b
        with:
          environment-url: ${{ secrets.POWERPLATFORM_URL }}
          app-id: ${{ secrets.POWERPLATFORM_APP_ID }}
          client-secret: ${{ secrets.POWERPLATFORM_CLIENT_SECRET }}
          tenant-id: ${{ secrets.POWERPLATFORM_TENANT_ID }}
          solution-file: out/CareOpsApprove_unmanaged.zip
          publish-changes: true
          use-deployment-settings-file: true
          deployment-settings-file: config/pilot.deploymentSettings.example.json

      - name: Retain deployed package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: CareOpsApprove-pilot-${{ github.run_number }}
          path: out/CareOpsApprove_unmanaged.zip
          if-no-files-found: error
