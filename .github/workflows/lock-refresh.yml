name: Regenerate CI lock candidate
on:
  pull_request:
    paths:
      - requirements-ci.txt
      - requirements-ci.lock
      - .github/workflows/lock-refresh.yml
      - .github/scripts/qualify-python.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-lock-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lock:
    name: Automatic hash-lock regeneration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Read immutable CareOps CI helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: edithatogo/careops
          ref: 30df4953ea87c8915b4a525fc671a4c9857c3f7f
          path: .local/ci-policy
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Regenerate exact CI lock automatically
        run: |
          mkdir -p .local/lock-refresh
          python .local/ci-policy/portfolio-scripts/ci_delivery.py lock --output requirements-ci.lock --receipt .local/lock-refresh/receipt.json
          cp requirements-ci.lock .local/lock-refresh/requirements-ci.lock
          git diff -- requirements-ci.lock > .local/lock-refresh/lock-update.patch
      - name: Verify regenerated lock consistency and installability
        run: |
          python -m pip install --require-hashes -r requirements-ci.lock
          python .github/scripts/qualify-python.py
      - name: Require the qualified generated lock to be committed
        run: git diff --exit-code -- requirements-ci.lock
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-lock-candidate
          path: .local/lock-refresh/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
